<!-- =====================================================
     KRISHI-MITRA
     SIDEBAR
     Left Navigation
     ===================================================== -->

<aside class="sidebar" id="sidebar">

    <!-- =================================================
         LOGO
         ================================================= -->

    <div class="sidebar-logo">

        <a href="#" class="logo-link" data-nav="dashboard">

            <div class="logo-icon">
                🌱
            </div>

            <div class="logo-text">

                <span class="logo-name">
                    Krishi-Mitra
                </span>

                <span class="logo-tagline">
                    Your Farming Companion
                </span>

            </div>

        </a>

    </div>


    <!-- =================================================
         FARMER NAVIGATION
         ================================================= -->

    <nav class="sidebar-navigation"
         aria-label="Main Navigation">

        <div class="nav-section">

            <span class="nav-section-title">
                MAIN
            </span>


            <!-- Dashboard -->

            <button
                class="nav-item active"
                type="button"
                data-nav="dashboard"
                aria-label="Dashboard">

                <span class="nav-icon">
                    🏠
                </span>

                <span class="nav-label">
                    Dashboard
                </span>

            </button>


            <!-- Mitra AI -->

            <button
                class="nav-item"
                type="button"
                data-nav="mitra"
                data-requires-login="true"
                aria-label="Mitra AI">

                <span class="nav-icon">
                    🤖
                </span>

                <span class="nav-label">
                    Mitra AI
                </span>

                <span class="nav-badge">
                    AI
                </span>

            </button>

        </div>


        <!-- =================================================
             FARM MANAGEMENT
             ================================================= -->

        <div class="nav-section">

            <span class="nav-section-title">
                FARM MANAGEMENT
            </span>


            <!-- Crop Health -->

            <button
                class="nav-item"
                type="button"
                data-nav="crop-health"
                data-requires-login="true"
                aria-label="Crop Health">

                <span class="nav-icon">
                    🌿
                </span>

                <span class="nav-label">
                    Crop Health
                </span>

            </button>


            <!-- Weather -->

            <button
                class="nav-item"
                type="button"
                data-nav="weather"
                data-requires-login="true"
                aria-label="Weather Forecast">

                <span class="nav-icon">
                    ☁️
                </span>

                <span class="nav-label">
                    Weather Forecast
                </span>

            </button>


            <!-- Market Prices -->

            <button
                class="nav-item"
                type="button"
                data-nav="market"
                data-requires-login="true"
                aria-label="Market Prices">

                <span class="nav-icon">
                    📈
                </span>

                <span class="nav-label">
                    Market Prices
                </span>

            </button>


            <!-- Irrigation -->

            <button
                class="nav-item"
                type="button"
                data-nav="irrigation"
                data-requires-login="true"
                aria-label="Irrigation Advice">

                <span class="nav-icon">
                    💧
                </span>

                <span class="nav-label">
                    Irrigation Advice
                </span>

            </button>


            <!-- Farm Tips -->

            <button
                class="nav-item"
                type="button"
                data-nav="farm-tips"
                data-requires-login="true"
                aria-label="Farm Tips">

                <span class="nav-icon">
                    💡
                </span>

                <span class="nav-label">
                    Farm Tips
                </span>

            </button>

        </div>


        <!-- =================================================
             INFORMATION
             ================================================= -->

        <div class="nav-section">

            <span class="nav-section-title">
                INFORMATION
            </span>


            <!-- Notifications -->

            <button
                class="nav-item"
                type="button"
                data-nav="notifications"
                data-requires-login="true"
                aria-label="Notifications">

                <span class="nav-icon">
                    🔔
                </span>

                <span class="nav-label">
                    Notifications
                </span>

                <span
                    class="notification-count"
                    data-notification-count>
                    0
                </span>

            </button>

        </div>

    </nav>


    <!-- =================================================
         SIDEBAR BOTTOM
         ================================================= -->

    <div class="sidebar-bottom">


        <!-- Profile -->

        <button
            class="sidebar-profile"
            type="button"
            data-open-profile
            aria-label="Open Profile">

            <div class="profile-avatar">

                <img
                    src=""
                    alt="Farmer profile"
                    data-profile-avatar
                    class="profile-avatar-image"
                >

                <span
                    class="profile-avatar-placeholder">
                    👨‍🌾
                </span>

            </div>


            <div class="profile-summary">

                <span
                    class="profile-summary-name"
                    data-profile-name>
                    Create Profile
                </span>

                <span class="profile-summary-status">
                    Farmer Profile
                </span>

            </div>


            <span class="profile-arrow">
                ›
            </span>

        </button>


        <!-- Sidebar Footer -->

        <div class="sidebar-footer">

            <span>
                Krishi-Mitra
            </span>

            <span>
                •
            </span>

            <span>
                Smart Farming
            </span>

        </div>

    </div>

</aside>
