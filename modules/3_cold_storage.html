<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Storage Availability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #module-map { z-index: 0; }
        .farm-icon { background: white; border: 2px solid #064e3b; border-radius: 50%; width: 14px !important; height: 14px !important; margin-left: -7px; margin-top: -7px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

<!-- Full Width Header matching Teammate Dashboard -->
<header class="bg-[#064e3b] shadow-md sticky top-0 z-10 text-white">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 py-5 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="bg-white p-2 rounded-xl text-2xl flex items-center justify-center">
                <svg class="w-6 h-6 text-[#064e3b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-white">Cold Storage Availability</h1>
                <p class="text-[10px] font-semibold text-emerald-200 uppercase tracking-wider">Preserve Harvest Quality</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center bg-black/20 rounded-xl p-2 px-4 gap-4 shadow-sm border border-white/10 w-full md:w-auto justify-center">
            <div class="flex items-center gap-2 text-xs font-bold whitespace-nowrap">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span id="location-text">Detecting Precise Location...</span>
            </div>
            <div class="hidden sm:block w-px h-6 bg-white/20"></div>
            <div class="flex items-center gap-2 text-xs font-bold whitespace-nowrap">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                <span id="weather-text">Loading Weather...</span>
            </div>
        </div>
    </div>
</header>

<main class="flex-1 w-full max-w-7xl mx-auto px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">
    
    <div class="w-full lg:w-5/12 flex flex-col max-h-[700px]">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-4 flex gap-4">
            <div class="flex-1">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Crop to Store</label>
                <select id="crop-select" onchange="render()" class="bg-slate-50 border border-slate-300 font-bold rounded-lg px-4 py-3 outline-none w-full focus:border-[#064e3b]">
                    <option value="Tomato">Tomato</option>
                    <option value="Potato">Potato</option>
                    <option value="Onion">Onion</option>
                    <option value="Grapes">Grapes</option>
                    <option value="Sugarcane">Sugarcane</option>
                    <option value="Soybean">Soybean</option>
                    <option value="Wheat">Wheat</option>
                    <option value="Jowar">Jowar</option>
                    <option value="Rice">Rice</option>
                </select>
            </div>
            <div class="w-1/3">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Qty (Qtl)</label>
                <input type="number" id="qty-select" value="10" min="1" onchange="render()" class="bg-slate-50 border border-slate-300 font-bold rounded-lg px-4 py-3 outline-none w-full focus:border-[#064e3b]">
            </div>
        </div>
        
        <div id="storage-grid" class="flex-1 overflow-y-auto space-y-4 pr-2 km-scroll"></div>
    </div>
    
    <div class="w-full lg:w-7/12 bg-slate-100 rounded-3xl border border-slate-200 overflow-hidden relative min-h-[400px]">
        <div id="module-map" class="w-full h-full absolute inset-0"></div>
    </div>
    
    <script>
        let storages = [];
        async function initModule() {
            try {
                let r = await fetch(`http://localhost:5001/api/logistics?lat=${userLat}&lng=${userLng}`);
                let d = await r.json();
                if(d.storages) { storages = d.storages; }
                render();
                initMap();
            } catch(e) {}
        }
        function render() {
            let grid = document.getElementById('storage-grid');
            let crop = document.getElementById('crop-select').value;
            let qty = parseFloat(document.getElementById('qty-select').value) || 1;
            
            // Apply strict math from the user's specification image:
            // Base Storage Fee: ₹50 per quintal.
            // Crop-Specific Multipliers: Grapes (1.4), Onion (1.0), Sugarcane (0.8), Jowar/Rice (0.4)
            let tempReq = "Ambient";
            let multiplier = 1.0;
            if(crop === 'Grapes') { tempReq = "0°C"; multiplier = 1.4; }
            else if(crop === 'Onion') { tempReq = "Ventilated"; multiplier = 1.0; }
            else if(crop === 'Sugarcane') { tempReq = "4°C"; multiplier = 0.8; }
            else if(crop === 'Jowar' || crop === 'Rice') { tempReq = "Ambient"; multiplier = 0.4; }
            else if(crop === 'Potato') { tempReq = "3°C"; multiplier = 1.0; }
            else if(crop === 'Tomato') { tempReq = "10°C"; multiplier = 1.0; }
            else { tempReq = "Dry/Ventilated"; multiplier = 1.0; } // default
            
            let costPerQtl = 50 * multiplier;
            let totalFee = costPerQtl * qty;
            
            grid.innerHTML = '';
            storages.sort((a,b) => a.distance - b.distance).forEach(s => {
                grid.innerHTML += `
                <div class="p-5 rounded-2xl border border-slate-200 bg-white hover:border-[#064e3b] transition-all cursor-pointer shadow-sm" onclick="showRoute(${s.lat}, ${s.lng})">
                    <h3 class="font-bold text-slate-900 text-lg mb-1">${s.name}</h3>
                    <p class="text-xs font-semibold text-slate-500 mb-3 flex items-start gap-1">
                        <svg class="w-4 h-4 text-slate-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                        <span>${s.address}</span>
                    </p>
                    
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div class="bg-slate-50 p-2 rounded-lg border border-slate-100">
                            <span class="block text-[9px] font-bold text-slate-400 uppercase">Dist & Space</span>
                            <span class="text-xs font-bold text-slate-700">${s.distance} km • ${s.available} Qtl left</span>
                        </div>
                        <div class="bg-blue-50 p-2 rounded-lg border border-blue-100">
                            <span class="block text-[9px] font-bold text-blue-400 uppercase">Supported Temp</span>
                            <span class="text-xs font-bold text-blue-800">${tempReq} Facility</span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <span class="block text-[9px] font-bold text-slate-400 uppercase">Total Fee (${qty} Qtl)</span>
                            <span class="text-base font-black text-[#064e3b]">₹${totalFee.toFixed(2)}</span>
                            <span class="block text-[10px] font-bold text-slate-500 uppercase">Base: ₹${costPerQtl.toFixed(2)} / Qtl</span>
                        </div>
                        <div class="text-right">
                            <span class="block text-[9px] font-bold text-slate-400 uppercase">Contact Facility</span>
                            <span class="text-sm font-bold text-slate-800 flex items-center justify-end gap-1">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                ${s.contact}
                            </span>
                        </div>
                    </div>
                    
                    <button class="bg-[#064e3b] text-white px-4 py-3 rounded-xl font-bold text-sm w-full shadow-sm hover:bg-[#134e4a]">View Route on Map</button>
                </div>`;
            });
        }
        function initMap() {
            if(!document.getElementById('module-map')) return;
            map = L.map('module-map').setView([userLat, userLng], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);
            var farmIcon = L.divIcon({className: 'farm-icon'});
            L.marker([userLat, userLng], {icon: farmIcon}).addTo(map).bindPopup("<b>Farm</b>");
            storages.forEach(m => L.marker([m.lat, m.lng]).addTo(map).bindPopup(`<b>${m.name}</b>`));
        }
        let routeLine;
        function showRoute(dLat, dLng) {
            if(routeLine) map.removeLayer(routeLine);
            routeLine = L.polyline([[userLat, userLng], [dLat, dLng]], {color: '#0891b2', weight: 4}).addTo(map);
            map.fitBounds(routeLine.getBounds(), {padding:[50,50]});
        }
    </script>
    <style>.km-scroll::-webkit-scrollbar { width: 6px; } .km-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }</style>
    
</main>

<script>
    let userLat = 18.7516;
    let userLng = 73.8567;
    let map = null;

    async function initGlobal() {
        let cachedLat = localStorage.getItem('krishi_lat');
        let cachedLng = localStorage.getItem('krishi_lng');
        
        if (cachedLat && cachedLng) {
            userLat = parseFloat(cachedLat);
            userLng = parseFloat(cachedLng);
            await fetchLocationAndWeather();
            if(typeof initModule === 'function') initModule();
        } else if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    localStorage.setItem('krishi_lat', userLat);
                    localStorage.setItem('krishi_lng', userLng);
                    await fetchLocationAndWeather();
                    if(typeof initModule === 'function') initModule();
                },
                async () => {
                    await fetchLocationAndWeather();
                    if(typeof initModule === 'function') initModule();
                }
            );
        } else {
            await fetchLocationAndWeather();
            if(typeof initModule === 'function') initModule();
        }
    }

    async function fetchLocationAndWeather() {
        try {
            let locRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}`);
            let locData = await locRes.json();
            let preciseName = "";
            if (locData.address) {
                preciseName = locData.address.village || locData.address.town || locData.address.city_district || locData.address.county || "";
                if (preciseName) preciseName += ", ";
                preciseName += locData.address.state || "";
            }
            document.getElementById('location-text').innerText = preciseName || "Unknown Location";
        } catch(e) { document.getElementById('location-text').innerText = "Offline Mode"; }
        
        try {
            let r = await fetch(`http://localhost:5001/api/weather?lat=${userLat}&lng=${userLng}`);
            let d = await r.json();
            if(d.temperature) {
                document.getElementById('weather-text').innerText = `${d.temperature}°C, ${d.humidity}% Hum`;
            }
        } catch(e) { document.getElementById('weather-text').innerText = "Weather Offline"; }
    }
    
    window.onload = initGlobal;
</script>
    <script src="../frontend(gov)/js/translation.js"></script>
</body>
</html>
