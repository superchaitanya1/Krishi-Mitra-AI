<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Transport Pools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #module-map { z-index: 0; }
        .farm-icon { background: white; border: 2px solid #064e3b; border-radius: 50%; width: 14px !important; height: 14px !important; margin-left: -7px; margin-top: -7px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

<!-- Full Width Header matching Teammate Dashboard -->
<header class="bg-[#064e3b] shadow-md sticky top-0 z-10 text-white">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 py-5 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="bg-white p-2 rounded-xl text-2xl flex items-center justify-center">
                <svg class="w-6 h-6 text-[#064e3b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-white">Shared Transport Pools</h1>
                <p class="text-[10px] font-semibold text-emerald-200 uppercase tracking-wider">Logistics & Trucking Costs</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center bg-black/20 rounded-xl p-2 px-4 gap-4 shadow-sm border border-white/10 w-full md:w-auto justify-center">
            <div class="flex items-center gap-2 text-xs font-bold whitespace-nowrap">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span id="location-text">Detecting Precise Location...</span>
            </div>
            <div class="hidden sm:block w-px h-6 bg-white/20"></div>
            <div class="flex items-center gap-2 text-xs font-bold whitespace-nowrap">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                <span id="weather-text">Loading Weather...</span>
            </div>
        </div>
    </div>
</header>

<main class="flex-1 w-full max-w-7xl mx-auto px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">
    
    <div class="w-full flex flex-col">
        <div id="transport-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
    <script>
        async function initModule() {
            try {
                let r = await fetch(`http://localhost:5001/api/logistics?lat=${userLat}&lng=${userLng}`);
                let d = await r.json();
                let grid = document.getElementById('transport-grid');
                if(!d.transport_pools) return;
                
                d.transport_pools.forEach((pool, idx) => {
                    let percent = (pool.booked / pool.capacity) * 100;
                    
                    // Transport Math: ₹50 / Quintal per 7 km
                    // Direct Rate per Qtl = (Distance / 7) * ₹50
                    // Shared Pool Rate per Qtl = (Distance / 7) * ₹25 (50% Pool Discount)
                    let directCostPerQtl = Math.round((pool.distance / 7.0) * 50);
                    let sharedCostPerQtl = Math.round((pool.distance / 7.0) * 25);
                    
                    grid.innerHTML += `
                    <div class="p-6 rounded-3xl border border-slate-200 bg-white shadow-sm hover:shadow-md transition-all flex flex-col">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-extrabold text-xl text-slate-900">${pool.truck_type}</h3>
                                <p class="text-xs font-bold text-slate-500 mt-1 uppercase tracking-wider">${pool.vehicle}</p>
                            </div>
                            <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-1 rounded border border-amber-200">50% POOL DISCOUNT</span>
                        </div>
                        
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-5">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-slate-400 uppercase">Route Detail (${pool.distance} km)</span>
                                <span class="text-[10px] font-bold bg-[#064e3b] text-white px-2 py-0.5 rounded">ETA: ${pool.pickup_time}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-slate-800 text-sm flex-1">${pool.from}</span>
                                <span class="text-slate-300">➔</span>
                                <span class="font-bold text-slate-800 text-sm flex-1 text-right">${pool.to}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-5">
                            <div>
                                <span class="block text-[10px] font-bold text-slate-400 uppercase">Driver</span>
                                <span class="text-sm font-bold text-slate-800">${pool.driver}</span>
                                <span class="text-xs font-bold text-slate-500 mt-0.5 flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    ${pool.contact}
                                </span>
                            </div>
                            <div class="text-right">
                                <span class="block text-[10px] font-bold text-slate-400 uppercase">Shared Rate</span>
                                <span class="text-lg font-black text-[#064e3b]">₹${sharedCostPerQtl.toFixed(0)}</span>
                                <span class="block text-[10px] font-bold text-slate-500 uppercase -mt-1">/ Quintal</span>
                            </div>
                        </div>
                        
                        <div class="w-full bg-slate-100 rounded-full h-3 mb-2">
                            <div class="bg-[#064e3b] h-3 rounded-full" style="width: ${percent}%"></div>
                        </div>
                        <p class="text-xs font-bold text-slate-500 mb-4 flex justify-between">
                            <span>Booked: ${pool.booked} Qtl</span>
                            <span class="text-[#064e3b]">Space Left: ${pool.capacity - pool.booked} Qtl</span>
                        </p>
                        
                        <div class="space-y-3 mb-4 pt-4 border-t border-slate-100 flex-1">
                            <div class="flex gap-2">
                                <div class="flex-1">
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Crop</label>
                                    <select class="w-full bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold p-2 outline-none focus:border-[#064e3b]">
                                        <option>Tomato</option><option>Onion</option><option>Grapes</option><option>Wheat</option>
                                    </select>
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Quantity</label>
                                    <div class="flex items-center">
                                        <input type="number" id="t-qty-${idx}" value="5" min="1" max="${pool.capacity - pool.booked}" class="w-full bg-slate-50 border border-slate-200 rounded-l-lg text-xs font-bold p-2 outline-none border-r-0 focus:border-[#064e3b]" onchange="updateTransportCost(${idx}, ${sharedCostPerQtl})">
                                        <span class="bg-slate-100 border border-slate-200 rounded-r-lg px-2 py-2 text-[10px] font-bold text-slate-500">Qtl</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex justify-between items-center bg-emerald-50 p-2 rounded border border-emerald-100">
                                <span class="text-xs font-bold text-[#064e3b]">Total Cost:</span>
                                <span id="t-total-${idx}" class="text-sm font-black text-[#064e3b]">₹${(sharedCostPerQtl * 5).toFixed(0)}</span>
                            </div>
                        </div>
                        
                        <div id="t-alert-${idx}" class="hidden p-3 bg-emerald-50 text-[#064e3b] font-bold text-xs rounded-xl mb-4 text-center border border-emerald-200"></div>

                        <button onclick="document.getElementById('t-alert-${idx}').innerText = 'Request Confirmed! ' + ('${pool.driver}').split(' ')[0] + ' will contact you shortly.'; document.getElementById('t-alert-${idx}').classList.remove('hidden');" 
                            class="bg-[#064e3b] hover:bg-[#134e4a] text-white font-bold py-3.5 px-4 rounded-xl w-full transition-transform active:scale-[0.98] mt-auto">
                            Join Truck & Book Space
                        </button>
                    </div>`;
                });
            } catch(e) {}
        }
        
        function updateTransportCost(idx, rate) {
            let qty = parseFloat(document.getElementById(`t-qty-${idx}`).value) || 0;
            document.getElementById(`t-total-${idx}`).innerText = "₹" + (rate * qty).toFixed(0);
        }
    </script>
    
</main>

<script>
    let userLat = 18.7516;
    let userLng = 73.8567;
    let map = null;

    async function initGlobal() {
        let cachedLat = localStorage.getItem('krishi_lat');
        let cachedLng = localStorage.getItem('krishi_lng');
        
        if (cachedLat && cachedLng) {
            userLat = parseFloat(cachedLat);
            userLng = parseFloat(cachedLng);
            await fetchLocationAndWeather();
            if(typeof initModule === 'function') initModule();
        } else if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    localStorage.setItem('krishi_lat', userLat);
                    localStorage.setItem('krishi_lng', userLng);
                    await fetchLocationAndWeather();
                    if(typeof initModule === 'function') initModule();
                },
                async () => {
                    await fetchLocationAndWeather();
                    if(typeof initModule === 'function') initModule();
                }
            );
        } else {
            await fetchLocationAndWeather();
            if(typeof initModule === 'function') initModule();
        }
    }

    async function fetchLocationAndWeather() {
        try {
            let locRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}`);
            let locData = await locRes.json();
            let preciseName = "";
            if (locData.address) {
                preciseName = locData.address.village || locData.address.town || locData.address.city_district || locData.address.county || "";
                if (preciseName) preciseName += ", ";
                preciseName += locData.address.state || "";
            }
            document.getElementById('location-text').innerText = preciseName || "Unknown Location";
        } catch(e) { document.getElementById('location-text').innerText = "Offline Mode"; }
        
        try {
            let r = await fetch(`http://localhost:5001/api/weather?lat=${userLat}&lng=${userLng}`);
            let d = await r.json();
            if(d.temperature) {
                document.getElementById('weather-text').innerText = `${d.temperature}°C, ${d.humidity}% Hum`;
            }
        } catch(e) { document.getElementById('weather-text').innerText = "Weather Offline"; }
    }
    
    window.onload = initGlobal;
</script>
    <script src="../frontend(gov)/js/translation.js"></script>
</body>
</html>
