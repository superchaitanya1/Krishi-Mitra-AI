<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Producer Orgs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #module-map { z-index: 0; }
        .farm-icon { background: white; border: 2px solid #064e3b; border-radius: 50%; width: 14px !important; height: 14px !important; margin-left: -7px; margin-top: -7px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

<!-- Full Width Header matching Teammate Dashboard -->
<header class="bg-[#064e3b] shadow-md sticky top-0 z-10 text-white">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 py-5 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="bg-white p-2 rounded-xl text-2xl flex items-center justify-center">
                <svg class="w-6 h-6 text-[#064e3b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-white">Farmer Producer Orgs</h1>
                <p class="text-[10px] font-semibold text-emerald-200 uppercase tracking-wider">Bulk Selling & Negotiation</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center bg-black/20 rounded-xl p-2 px-4 gap-4 shadow-sm border border-white/10 w-full md:w-auto justify-center">
            <div class="flex items-center gap-2 text-xs font-bold whitespace-nowrap">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span id="location-text">Detecting Precise Location...</span>
            </div>
            <div class="hidden sm:block w-px h-6 bg-white/20"></div>
            <div class="flex items-center gap-2 text-xs font-bold whitespace-nowrap">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                <span id="weather-text">Loading Weather...</span>
            </div>
        </div>
    </div>
</header>

<main class="flex-1 w-full max-w-7xl mx-auto px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">
    
    <div class="w-full flex flex-col">
        <div id="fpo-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </div>
    <script>
        async function initModule() {
            try {
                let r = await fetch(`http://localhost:5001/api/logistics?lat=${userLat}&lng=${userLng}`);
                let d = await r.json();
                let grid = document.getElementById('fpo-grid');
                if(!d.fpos) return;
                
                d.fpos.forEach((fpo, idx) => {
                    grid.innerHTML += `
                    <div class="p-6 sm:p-8 rounded-3xl border border-slate-200 bg-white shadow-sm flex flex-col hover:border-[#064e3b] transition-all">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 class="font-extrabold text-slate-900 text-2xl mb-1">${fpo.name}</h3>
                                <p class="text-sm font-semibold text-slate-500 flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                    ${fpo.distance} km away • <span class="text-[#064e3b]">${fpo.members} Farmers</span>
                                </p>
                            </div>
                            <div class="bg-emerald-50 text-[#064e3b] p-3 rounded-2xl">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </div>
                        </div>
                        
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 mb-6">
                            <span class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Coordinator Details</span>
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-[#064e3b] text-white flex items-center justify-center text-lg font-bold">${fpo.coordinator.charAt(0)}</div>
                                <div>
                                    <span class="text-sm font-bold text-slate-800 block">${fpo.coordinator}</span>
                                    <span class="text-xs font-bold text-slate-500 flex items-center gap-1">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                        ${fpo.contact}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4 mb-6 flex-1">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Crop to Pool</label>
                                <select class="bg-white border border-slate-300 font-bold rounded-xl px-4 py-3 outline-none w-full focus:border-[#064e3b]">
                                    <option>Tomato</option><option>Onion</option><option>Soybean</option><option>Wheat</option><option>Sugarcane</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Quantity (Quintals)</label>
                                <input type="number" value="10" min="1" class="bg-white border border-slate-300 font-bold rounded-xl px-4 py-3 outline-none w-full focus:border-[#064e3b]">
                            </div>
                        </div>
                        
                        <div id="fpo-alert-${idx}" class="hidden p-3 bg-emerald-50 text-[#064e3b] font-bold text-sm rounded-xl mb-4 text-center border border-emerald-200"></div>

                        <button onclick="document.getElementById('fpo-alert-${idx}').innerText = 'Request Sent! Coordinator ' + ('${fpo.coordinator}').split(' ')[0] + ' will call you.'; document.getElementById('fpo-alert-${idx}').classList.remove('hidden');" 
                            class="bg-[#064e3b] hover:bg-[#134e4a] text-white font-bold py-4 px-4 rounded-xl w-full shadow-md transition-transform active:scale-[0.98]">
                            Join Collective & Request Pickup
                        </button>
                    </div>`;
                });
            } catch(e) {}
        }
    </script>
    
</main>

<script>
    let userLat = 18.7516;
    let userLng = 73.8567;
    let map = null;

    async function initGlobal() {
        let cachedLat = localStorage.getItem('krishi_lat');
        let cachedLng = localStorage.getItem('krishi_lng');
        
        if (cachedLat && cachedLng) {
            userLat = parseFloat(cachedLat);
            userLng = parseFloat(cachedLng);
            await fetchLocationAndWeather();
            if(typeof initModule === 'function') initModule();
        } else if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    localStorage.setItem('krishi_lat', userLat);
                    localStorage.setItem('krishi_lng', userLng);
                    await fetchLocationAndWeather();
                    if(typeof initModule === 'function') initModule();
                },
                async () => {
                    await fetchLocationAndWeather();
                    if(typeof initModule === 'function') initModule();
                }
            );
        } else {
            await fetchLocationAndWeather();
            if(typeof initModule === 'function') initModule();
        }
    }

    async function fetchLocationAndWeather() {
        try {
            let locRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}`);
            let locData = await locRes.json();
            let preciseName = "";
            if (locData.address) {
                preciseName = locData.address.village || locData.address.town || locData.address.city_district || locData.address.county || "";
                if (preciseName) preciseName += ", ";
                preciseName += locData.address.state || "";
            }
            document.getElementById('location-text').innerText = preciseName || "Unknown Location";
        } catch(e) { document.getElementById('location-text').innerText = "Offline Mode"; }
        
        try {
            let r = await fetch(`http://localhost:5001/api/weather?lat=${userLat}&lng=${userLng}`);
            let d = await r.json();
            if(d.temperature) {
                document.getElementById('weather-text').innerText = `${d.temperature}°C, ${d.humidity}% Hum`;
            }
        } catch(e) { document.getElementById('weather-text').innerText = "Weather Offline"; }
    }
    
    window.onload = initGlobal;
</script>
    <script src="../frontend(gov)/js/translation.js"></script>
</body>
</html>
